version: "0.1.0.6"
targetAbi: "12.3.0.0"
framework: "net10.0"
overview: "Gapless Web Audio playback for eligible audio queues."
description: >
  Adds an experimental local Web Audio player to the Jellyfin web client that
  plays eligible direct-play audio queues gaplessly by decoding and scheduling
  adjacent tracks on a shared AudioContext timeline. The stock HTML audio player
  remains the fallback. The plugin injects its client bundle into the served web
  client by rewriting its responses in memory; nothing is written to disk.
category: "General"
owner: "ryad-lindner"
artifacts:
- "Jellyfin.Plugin.GaplessPlayer.dll"
changelog: >
  Gapless Web Audio playback for eligible audio queues. Injects into the stock
  web client in-memory (no web-root writes); now-playing-bar on/off toggle;
  download progress in the seek bar while a track loads; optional now-playing
  browser notifications (plugin setting); repeat and shuffle; seek and unpause
  near the end of a track start immediately; graceful fallback to the normal
  player for undecodable tracks; strips leading ID3 tags so tagged FLAC decodes
  gaplessly. Requires Jellyfin 12.3 or later.
